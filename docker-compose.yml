services:
  nfc-mqtt-bridge:
    image: ghcr.io/scottfridwin/nfc-mqtt-bridge:1
    # build: .   # build from source instead
    container_name: nfc-mqtt-bridge
    restart: unless-stopped
    environment:
      MQTT_HOST: homeassistant.local
      MQTT_PORT: 1883
      MQTT_USERNAME: nfc
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_password
      DEVICE_ID: nfc_reader
      DEVICE_NAME: NFC Reader
      LOG_LEVEL: INFO
    secrets:
      - mqtt_password
    volumes:
      - /run/pcscd:/run/pcscd   # the host's pcscd socket

secrets:
  mqtt_password:
    file: ./mqtt_password.txt
